<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>css.soccer: Full Match Alpha</title>
  </head>
  <body>
    <main id="app" aria-label="css.soccer Full Match Alpha, Spain versus Argentina">
      <section
        id="scene"
        aria-label="Prepared Spain versus Argentina match"
        tabindex="0"
      ></section>

      <section
        id="country-choice"
        role="dialog"
        aria-modal="true"
        aria-labelledby="country-choice-title"
        aria-describedby="country-choice-description"
        hidden
      >
        <div id="country-choice-panel">
          <p id="country-choice-release">Full Match Alpha</p>
          <h1 id="country-choice-title">Choose your team</h1>
          <p id="country-choice-description">Spain vs Argentina · Full 90-minute match</p>
          <div id="country-choice-actions">
            <button type="button" data-country-choice="spain" aria-label="Play as Spain">
              <strong>Spain</strong>
              <span>Home</span>
            </button>
            <button type="button" data-country-choice="argentina" aria-label="Play as Argentina">
              <strong>Argentina</strong>
              <span>Away</span>
            </button>
          </div>
        </div>
      </section>

      <section
        id="match-hud"
        aria-label="Native Actua match display"
        popover="manual"
        hidden
      >
        <time id="hud-clock" datetime="PT0M0S" aria-label="0 minutes 0 seconds">
          <span data-native-hud-glyph-slot="0" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="1" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="2" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="3" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="4" aria-hidden="true"></span>
        </time>
        <span id="hud-camera-message" role="img" aria-label="Wire camera" hidden>
          <span data-native-hud-glyph-slot="0" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="1" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="2" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="3" aria-hidden="true"></span>
        </span>
        <span
          id="hud-possession-team-a"
          data-native-hud-slot-count="20"
          role="img"
          aria-label="Spain player in possession"
          hidden
        ></span>
        <span
          id="hud-possession-team-b"
          data-native-hud-slot-count="20"
          role="img"
          aria-label="Argentina player in possession"
          hidden
        ></span>
        <span id="hud-team-a" role="img" aria-label="Spain">
          <span data-native-hud-glyph-slot="0" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="1" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="2" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="3" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="4" aria-hidden="true"></span>
        </span>
        <output id="hud-score" aria-label="Spain 0, Argentina 0">
          <span data-native-hud-glyph-slot="0" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="1" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="2" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="3" aria-hidden="true" hidden></span>
          <span data-native-hud-glyph-slot="4" aria-hidden="true" hidden></span>
        </output>
        <span id="hud-team-b" role="img" aria-label="Argentina">
          <span data-native-hud-glyph-slot="0" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="1" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="2" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="3" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="4" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="5" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="6" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="7" aria-hidden="true"></span>
          <span data-native-hud-glyph-slot="8" aria-hidden="true"></span>
        </span>
        <div id="hud-halftime-menu" aria-label="Half time" hidden>
          <span id="hud-halftime-filter" aria-hidden="true"></span>
          <span class="hud-menu-sprite hud-menu-corner hud-menu-corner-tl" aria-hidden="true"></span>
          <span class="hud-menu-sprite hud-menu-corner hud-menu-corner-tr" aria-hidden="true"></span>
          <span class="hud-menu-sprite hud-menu-corner hud-menu-corner-br" aria-hidden="true"></span>
          <span class="hud-menu-sprite hud-menu-corner hud-menu-corner-bl" aria-hidden="true"></span>
          <span class="hud-menu-edge-row hud-menu-edge-top" data-native-menu-edge-count="16" aria-hidden="true"></span>
          <span class="hud-menu-edge-row hud-menu-edge-bottom" data-native-menu-edge-count="16" aria-hidden="true"></span>
          <span class="hud-menu-edge-column hud-menu-edge-left" data-native-menu-edge-count="4" aria-hidden="true"></span>
          <span class="hud-menu-edge-column hud-menu-edge-right" data-native-menu-edge-count="4" aria-hidden="true"></span>
          <span class="hud-menu-sprite hud-menu-shirt-a" aria-hidden="true"></span>
          <span class="hud-menu-sprite hud-menu-shirt-b" aria-hidden="true"></span>
          <span id="hud-halftime-heading" data-native-hud-slot-count="9" role="img" aria-label="Half time"></span>
          <span id="hud-halftime-team-a" data-native-hud-slot-count="5" role="img" aria-label="Spain"></span>
          <output id="hud-halftime-score-a" data-native-hud-slot-count="2" aria-label="Spain score"></output>
          <output id="hud-halftime-score-b" data-native-hud-slot-count="2" aria-label="Argentina score"></output>
          <span id="hud-halftime-team-b" data-native-hud-slot-count="9" role="img" aria-label="Argentina"></span>
          <span id="hud-halftime-scorer-a" data-native-hud-slot-count="32" role="img" aria-label="Spain scorers"></span>
          <span id="hud-halftime-scorer-b" data-native-hud-slot-count="32" role="img" aria-label="Argentina scorers"></span>
        </div>
      </section>

      <section id="touch-controls" aria-label="Touch match controls">
        <div id="touch-directions" aria-label="Movement controls">
          <button type="button" data-cssoccer-control="move-up" aria-label="Move up" aria-pressed="false"><span aria-hidden="true">▲</span></button>
          <button type="button" data-cssoccer-control="move-left" aria-label="Move left" aria-pressed="false"><span aria-hidden="true">◀</span></button>
          <button type="button" data-cssoccer-control="move-down" aria-label="Move down" aria-pressed="false"><span aria-hidden="true">▼</span></button>
          <button type="button" data-cssoccer-control="move-right" aria-label="Move right" aria-pressed="false"><span aria-hidden="true">▶</span></button>
        </div>
        <div id="touch-actions" aria-label="Action controls">
          <button type="button" data-cssoccer-control="fire-1" aria-label="Shoot or tackle" aria-pressed="false"><span aria-hidden="true">A</span></button>
          <button type="button" data-cssoccer-control="fire-2" aria-label="Pass, sprint, or steal" aria-pressed="false"><span aria-hidden="true">B</span></button>
        </div>
      </section>

      <output id="status" role="status" aria-live="polite">Loading prepared match…</output>
    </main>
    <script type="module" src="/src/cssoccer/main.mjs"></script>
  </body>
</html>
